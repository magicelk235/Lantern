# Lantern app. Generate with `xcodegen generate --spec App/project.yml`; the .xcodeproj is not checked in.
name: Lantern
options:
  bundleIdPrefix: com.magicelklabs
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    # Xcode only adds `--options runtime` for real identities; keep every build hardened.
    OTHER_CODE_SIGN_FLAGS: --options=runtime
    # A real identity is required: Background Task Management refuses to spawn a bundled LaunchAgent whose executable
    # has no Team ID (`Bundle identifiers from launchd plist ignored because the executable doesn't have a Team ID`,
    # then `Unable to update LWCR with smd: 22`), so an ad-hoc signed ompd never starts. `scripts/release.sh` re-signs
    # the archive with Developer ID when it exports it.
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: Apple Development
    DEVELOPMENT_TEAM: V8K8L3ZSD5
    DEAD_CODE_STRIPPING: YES
  configs:
    # Universal. Debug keeps Xcode's defaults: the active architecture only.
    Release:
      ARCHS: arm64 x86_64
      ONLY_ACTIVE_ARCH: NO
packages:
  Lantern:
    path: ..
  # The Lantern package's own SwiftTerm, so both resolve to one: 1.20.0 with a renderer fix, until a release has it
  # (Vendor/SwiftTerm/README.md).
  SwiftTerm:
    path: ../Vendor/SwiftTerm
  # The editor: CodeEditSourceEditor with tree-sitter grammars from CodeEditLanguages. The two packages it
  # builds on are listed for the modules the app imports, pinned where it pins them.
  CodeEditSourceEditor:
    url: https://github.com/CodeEditApp/CodeEditSourceEditor
    exactVersion: 0.15.2
  CodeEditTextView:
    url: https://github.com/CodeEditApp/CodeEditTextView
    from: 0.12.1
  CodeEditLanguages:
    url: https://github.com/CodeEditApp/CodeEditLanguages
    exactVersion: 0.1.20
  # App updates. Started only when the build names a feed (`Updates.swift`).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
targets:
  Lantern:
    type: application
    platform: macOS
    sources:
      - path: Sources
      # The app icon (Icon Composer). README.md shows App/AppIcon.png, exported from it with Icon Composer's ictool.
      - path: AppIcon.icon
      # Only the accent color (`AccentColor`, the icon's ember): the icon stays in AppIcon.icon.
      - path: Resources/Assets.xcassets
      - path: Resources/LaunchAgents/com.magicelklabs.lantern.ompd.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - package: Lantern
        product: IDEModel
      - package: Lantern
        product: IDEState
      # Terminal tabs render with SwiftTerm's AppKit `TerminalView`.
      - package: SwiftTerm
        product: SwiftTerm
      - package: Lantern
        product: IDEEditorModel
      # The editor's language servers: ChimeHQ's LanguageClient comes with it, resolved from the
      # Lantern package's own requirements.
      - package: Lantern
        product: IDELanguageModel
      # The login shell's environment the language servers run in.
      - package: Lantern
        product: IDEShellEnvironment
      - package: CodeEditSourceEditor
      - package: CodeEditTextView
      - package: CodeEditLanguages
      - package: Sparkle
      # The daemon ships inside the app so SMAppService can register it.
      - target: ompd
        embed: true
        codeSign: true
        copy:
          destination: executables
    postBuildScripts:
      # The ide-bridge extension each omp loads (`-e`) lives in the bundle's Resources. Copied when present; a
      # previously copied file is removed when the source is gone so the bundle never ships a stale bridge.
      - name: Copy ide-bridge
        basedOnDependencyAnalysis: false
        # Declared so the app is re-signed after the copy (the source may be absent, so it cannot be an input).
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ide-bridge.ts
        script: |
          src="${SRCROOT}/../bridge/ide-bridge.ts"
          dest="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/ide-bridge.ts"
          if [ -f "$src" ]; then
            mkdir -p "$(dirname "$dest")"
            cp -f "$src" "$dest"
          else
            rm -f "$dest"
          fi
      # Xcode rewrites the bundle in place, so its modification date never changes and macOS keeps showing the
      # icon it cached for this path. Touching the bundle makes it re-read the icon, so do it whenever AppIcon.icon
      # changes. Icon Composer saves the whole package (new folder dates); icon.json and Assets cover edits by hand.
      - name: Refresh icon cache
        inputFiles:
          - $(SRCROOT)/AppIcon.icon
          - $(SRCROOT)/AppIcon.icon/icon.json
          - $(SRCROOT)/AppIcon.icon/Assets
        outputFiles:
          - $(DERIVED_FILE_DIR)/app-icon.stamp
        script: |
          touch "${TARGET_BUILD_DIR}/${WRAPPER_NAME}" "${DERIVED_FILE_DIR}/app-icon.stamp"
    settings:
      base:
        PRODUCT_NAME: Lantern
        PRODUCT_BUNDLE_IDENTIFIER: com.magicelklabs.lantern
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Lantern
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        # Merged into the generated Info.plist: Sparkle's feed and EdDSA public key from the two settings below.
        INFOPLIST_FILE: Resources/Info.plist
        # Empty: no feed, so Sparkle is never started and Check for Updates… is hidden. `scripts/release.sh` sets
        # them from FEED_URL and SPARKLE_PUBLIC_KEY.
        SPARKLE_FEED_URL: ""
        SPARKLE_PUBLIC_ED_KEY: ""
        # Spawns processes, owns a unix socket in ~/Library and registers a LaunchAgent: never sandboxed.
        ENABLE_APP_SANDBOX: NO
        # The ide-bridge copy reads a file outside the declared inputs (it may not exist).
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Written into Info.plist as NSAccentColorName. A user who picked an accent in System Settings sees theirs.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Under the hardened runtime, library validation rejects the ad-hoc signed Debug `*.debug.dylib` split
        # (no Team ID); link Debug as one executable like Release.
        ENABLE_DEBUG_DYLIB: NO
    scheme:
      gatherCoverageData: false
  ompd:
    type: tool
    platform: macOS
    sources:
      - path: ../Sources/ompd
    dependencies:
      - package: Lantern
        product: OmpdCore
      - package: Lantern
        product: IDETransport
    settings:
      base:
        PRODUCT_NAME: ompd
        PRODUCT_BUNDLE_IDENTIFIER: com.magicelklabs.lantern.ompd
        SKIP_INSTALL: YES
        # A bare tool has no bundle: embed an Info.plist section so the code signature carries com.magicelklabs.lantern.ompd.
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        # Optimized for size. Its package modules (OmpdCore, …) take -Osize from Package.swift.
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-Osize"
