# omp IDE app. Generate with `xcodegen generate --spec App/project.yml`; the .xcodeproj is not checked in.
name: OmpIDE
options:
  bundleIdPrefix: com.omp-ide
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    # Xcode only adds `--options runtime` for real identities; keep ad-hoc local builds hardened too.
    OTHER_CODE_SIGN_FLAGS: --options=runtime
    # Ad-hoc signing for local builds; release builds override with the Developer ID identity.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    DEAD_CODE_STRIPPING: YES
packages:
  OmpIDE:
    path: ..
targets:
  omp IDE:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/LaunchAgents/com.omp-ide.ompd.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - package: OmpIDE
        product: IDEModel
      # The daemon ships inside the app so SMAppService can register it.
      - target: ompd
        embed: true
        codeSign: true
        copy:
          destination: executables
    postBuildScripts:
      # The ide-bridge extension each omp loads (`-e`) lives in the bundle's Resources. Copied when present; a
      # previously copied file is removed when the source is gone so the bundle never ships a stale bridge.
      - name: Copy ide-bridge
        basedOnDependencyAnalysis: false
        # Declared so the app is re-signed after the copy (the source may be absent, so it cannot be an input).
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/ide-bridge.ts
        script: |
          src="${SRCROOT}/../bridge/ide-bridge.ts"
          dest="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/ide-bridge.ts"
          if [ -f "$src" ]; then
            mkdir -p "$(dirname "$dest")"
            cp -f "$src" "$dest"
          else
            rm -f "$dest"
          fi
    settings:
      base:
        PRODUCT_NAME: omp IDE
        PRODUCT_BUNDLE_IDENTIFIER: com.omp-ide.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: omp IDE
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        # Spawns processes, owns a unix socket in ~/Library and registers a LaunchAgent: never sandboxed.
        ENABLE_APP_SANDBOX: NO
        # The ide-bridge copy reads a file outside the declared inputs (it may not exist).
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        COMBINE_HIDPI_IMAGES: YES
        # Under the hardened runtime, library validation rejects the ad-hoc signed Debug `*.debug.dylib` split
        # (no Team ID); link Debug as one executable like Release.
        ENABLE_DEBUG_DYLIB: NO
    scheme:
      gatherCoverageData: false
  ompd:
    type: tool
    platform: macOS
    sources:
      - path: ../Sources/ompd
    dependencies:
      - package: OmpIDE
        product: OmpdCore
    settings:
      base:
        PRODUCT_NAME: ompd
        PRODUCT_BUNDLE_IDENTIFIER: com.omp-ide.ompd
        SKIP_INSTALL: YES
        # A bare tool has no bundle: embed an Info.plist section so the code signature carries com.omp-ide.ompd.
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
